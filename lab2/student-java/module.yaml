product: jvm/app
settings:
  kotlin:
    version: 2.5.0-Beta2
    freeCompilerArgs:
      - '-Xcompanion-blocks-and-extensions'
      - '-Xstrict-equality-for-structural-classes'
      - '-Xexplicit-context-arguments'
      - '-Xcollection-literals'
  jvm:
    jdk:
      version: 25
      selectionMode: alwaysProvision
      distributions:
        - graalVM
